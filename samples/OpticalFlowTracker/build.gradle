plugins {
    alias(libs.plugins.kotlin.jvm)
}

group = 'org.bytedeco.javacv'
version = '1.5.12'
description = 'demo'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
//    modularity.inferModulePath.set(true)
}

sourceSets {
    main {
        java {
            srcDir files('../../javacv/samples')
            include 'OpticalFlowTracker.java'
        }
        resources {
            srcDir files('../../javacv/samples')
            includes = ["image0.png","image1.png"]
        }
    }
}

//FIXME crash at  Math.round(cornersAidx.get(i, 1))); maybe image error ? must change Java code !!
tasks.register('run', JavaExec) {
    group = "application"
    description = "Runs the OpticalFlowTracker main method"

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'OpticalFlowTracker'
    workingDir = rootProject.file("samples")
}

dependencies {

    implementation(libs.org.bytedeco.javacv.platform)
    implementation(libs.org.bytedeco.opencv.platform.gpu)
    implementation(libs.org.bytedeco.ffmpeg.platform.gpl)

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}
