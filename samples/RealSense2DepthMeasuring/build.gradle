plugins {
    alias(libs.plugins.kotlin.jvm)
}
//FIXME  must fix version use old javacv !!
group = 'org.bytedeco.javacv'
version = '1.5.12'
description = 'demo'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDir files('../../javacv/samples')
            include 'RealSense2DepthMeasuring.java'
        }
        resources {
            srcDir files('../../javacv/samples')
            includes = [""]
        }
    }
}

tasks.register('run', JavaExec) {
    group = "application"
    description = "Runs the RealSense2DepthMeasuring main method"

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'RealSense2DepthMeasuring'
    workingDir = rootProject.file("samples")
}

// [說明註解] 本模組因 RealSense 2 SDK 對新版 JavaCV 的相容性高度敏感，
// 依據原始專案之要求，刻意隔離並 Hardcode 使用舊版 1.5.12 穩定套件，不隨全域 toml 升級。
dependencies {
    implementation("org.bytedeco:javacv-platform:1.5.12")
    implementation("org.bytedeco:opencv-platform-gpu:4.11.0-1.5.12")
    implementation("org.bytedeco:ffmpeg-platform-gpl:7.1.1-1.5.12")

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}
